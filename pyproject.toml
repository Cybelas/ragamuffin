[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ragamuffin"
version = "0.1.0"
description = "A learning-first RAG knowledge base built from scratch."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "openai>=3.3.1,<4",
]

[project.scripts]
kb = "knowledge_base.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
